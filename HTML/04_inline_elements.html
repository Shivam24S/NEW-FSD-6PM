<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>inline</title>
  </head>
  <body>
    <!-- inline elements will occupy space as per their need and not start with new line -->

    <i>this is italic</i>

    <br />

    <i>this is italic</i>

    <br />

    <em>this is emphasize tag</em>

    <br />

    <b>this is bold tag</b>

    <br />

    <strong>this is strong</strong>

    <br />

    <small>this is small tag</small>

    <br />

    <h1>h2o</h1>

    <h1>h<sub>2</sub>o</h1>

    <!-- sup -->

    <h1>e=mc2</h1>

    <h1>e=mc<sup>2</sup></h1>

    <del>this is deleted</del>

    <br />

    <mark>this is mark</mark>

    <br />
    <u>this is underline</u>
    <br />

    <ins>this is inserted</ins>

    <br />

    <s>this is s</s>
  </body>
</html>
