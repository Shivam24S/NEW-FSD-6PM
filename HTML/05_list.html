<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List</title>
  </head>
  <body>
    <!-- order list -->

    <ol>
      <li>list-1</li>
      <li>list-2</li>
      <li>list-3</li>
      <li>list-4</li>
      <li>list-5</li>
    </ol>

    <!-- now with attribute -->

    <ol type="a">
      <li>list-1</li>
      <li>list-2</li>
      <li>list-3</li>
      <li>list-4</li>
      <li>list-5</li>
    </ol>

    <!-- un-order list -->

    <ul>
      <li>list-1</li>
      <li>list-2</li>
      <li>list-3</li>
      <li>list-4</li>
      <li>list-5</li>
    </ul>

    <!-- description list -->

    <dl>
      <dt>Vegetables</dt>
      <dd>Potato</dd>
      <dd>Onion</dd>
      <dd>Cucumber</dd>
      <dd>Garlic</dd>
      <dd>Tomato</dd>
    </dl>
  </body>
</html>
