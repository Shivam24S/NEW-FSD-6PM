<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Precedence</title>

    <link rel="stylesheet" href="./style.css" />

    <style>
        .internal {
            color: steelblue;
        }

        .inline {
            color: sienna;
            color: teal;
            color: slategray;
        }
    </style>


</head>

<body>


    <h1 style="color: slateblue;" class="inline">this is inline css</h1>


</body>

</html>


<!-- priority order -->

<!-- inline -> internal ->external -->
<!-- cascading  =>latest value will be applied -->
